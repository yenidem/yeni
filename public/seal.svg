<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="sealBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141e33" />
      <stop offset="70%" stop-color="#080e1b" />
      <stop offset="100%" stop-color="#03060c" />
    </radialGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="35%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="sealGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Star Ring / Seal Cog -->
  <circle cx="200" cy="200" r="190" fill="none" stroke="url(#goldBorder)" stroke-width="3" stroke-dasharray="4,6" opacity="0.7" />
  <circle cx="200" cy="200" r="180" fill="url(#sealBg)" stroke="url(#goldBorder)" stroke-width="4" filter="url(#sealGlow)" />
  <circle cx="200" cy="200" r="165" fill="none" stroke="url(#cyanAccent)" stroke-width="1.5" stroke-dasharray="2,4" opacity="0.8" />
  <circle cx="200" cy="200" r="156" fill="none" stroke="url(#goldBorder)" stroke-width="1" />

  <!-- Circular Text Paths -->
  <path id="textPathTop" d="M 50,200 A 150,150 0 0,1 350,200" fill="none" />
  <path id="textPathBottom" d="M 350,200 A 150,150 0 0,1 50,200" fill="none" />

  <text font-family="'Cinzel', 'Playfair Display', serif" font-size="12.5" font-weight="700" fill="#fbbf24" letter-spacing="3.5">
    <textPath href="#textPathTop" startOffset="50%" text-anchor="middle">
      ORÇUN KUNDAKCI &bull; AKADEMİK KÜLLİYAT
    </textPath>
  </text>

  <text font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#38bdf8" letter-spacing="2.5">
    <textPath href="#textPathBottom" startOffset="50%" text-anchor="middle">
      &bull; SHA-512 SECURED &bull; POST-QUANTUM SEAL &bull;
    </textPath>
  </text>

  <!-- Inner Center Star of Wisdom & Monogram -->
  <g transform="translate(200, 200)">
    <!-- Center Background Halo -->
    <circle cx="0" cy="0" r="85" fill="#0c1629" stroke="url(#goldBorder)" stroke-width="2" />
    <circle cx="0" cy="0" r="75" fill="none" stroke="#0ea5e9" stroke-width="1" opacity="0.4" />

    <!-- Stylized OK Monogram & Pen Tip -->
    <!-- Quill Nib / Stylus -->
    <path d="M 0,-48 L 12,-16 L 4,22 L 0,38 L -4,22 L -12,-16 Z" fill="url(#goldBorder)" />
    <line x1="0" y1="-45" x2="0" y2="28" stroke="#0c1629" stroke-width="1.5" />
    <circle cx="0" cy="28" r="1.5" fill="#ffffff" />

    <!-- O Ring Orbit -->
    <ellipse cx="0" cy="-2" rx="42" ry="24" fill="none" stroke="url(#cyanAccent)" stroke-width="2" transform="rotate(-25)" opacity="0.85" />
    <circle cx="-32" cy="14" r="3" fill="#fbbf24" />
    <circle cx="32" cy="-18" r="3" fill="#38bdf8" />

    <!-- Subtitle text in center -->
    <text x="0" y="55" font-family="'Cinzel', serif" font-size="8" font-weight="700" fill="#e2e8f0" text-anchor="middle" letter-spacing="2">
      TDE &amp; FELSEFE
    </text>
  </g>
</svg>
