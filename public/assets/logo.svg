<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="55%" fx="45%" fy="40%">
      <stop offset="0%" stop-color="#02419e" />
      <stop offset="45%" stop-color="#011b58" />
      <stop offset="85%" stop-color="#000d2e" />
      <stop offset="100%" stop-color="#000617" />
    </radialGradient>
    
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="30%" stop-color="#0284c7" />
      <stop offset="70%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <linearGradient id="emblemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="25%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <linearGradient id="innerRimGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0c4a6e" stop-opacity="0.9" />
    </linearGradient>

    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Shadow & Base Circle -->
  <circle cx="250" cy="250" r="235" fill="none" stroke="url(#rimGrad)" stroke-width="6" filter="url(#softGlow)" />
  <circle cx="250" cy="250" r="228" fill="url(#bgGrad)" stroke="#0284c7" stroke-width="2" />
  <circle cx="250" cy="250" r="218" fill="none" stroke="url(#innerRimGrad)" stroke-width="3" opacity="0.85" />

  <!-- Inner Soft Radial Light -->
  <circle cx="250" cy="250" r="140" fill="#0284c7" opacity="0.12" filter="url(#cyanGlow)" />

  <!-- Constellation Dots Left -->
  <g fill="#38bdf8" opacity="0.95" filter="url(#softGlow)">
    <!-- Column 1 (outer curve) -->
    <circle cx="85" cy="250" r="4.5" opacity="0.6" />
    <circle cx="92" cy="225" r="5" opacity="0.65" />
    <circle cx="92" cy="275" r="5" opacity="0.65" />
    <circle cx="102" cy="202" r="5.5" opacity="0.7" />
    <circle cx="102" cy="298" r="5.5" opacity="0.7" />
    <circle cx="118" cy="180" r="6" opacity="0.75" />
    <circle cx="118" cy="320" r="6" opacity="0.75" />

    <!-- Column 2 (middle) -->
    <circle cx="118" cy="250" r="8" opacity="0.9" />
    <circle cx="125" cy="222" r="8.5" opacity="0.85" />
    <circle cx="125" cy="278" r="8.5" opacity="0.85" />
    <circle cx="138" cy="198" r="7.5" opacity="0.8" />
    <circle cx="138" cy="302" r="7.5" opacity="0.8" />

    <!-- Column 3 (inner) -->
    <circle cx="152" cy="250" r="10" />
    <circle cx="158" cy="220" r="9" />
    <circle cx="158" cy="280" r="9" />
    <circle cx="170" cy="192" r="7" opacity="0.75" />
    <circle cx="170" cy="308" r="7" opacity="0.75" />
  </g>

  <!-- Constellation Dots Right -->
  <g fill="#38bdf8" opacity="0.95" filter="url(#softGlow)">
    <!-- Column 1 (outer curve) -->
    <circle cx="415" cy="250" r="4.5" opacity="0.6" />
    <circle cx="408" cy="225" r="5" opacity="0.65" />
    <circle cx="408" cy="275" r="5" opacity="0.65" />
    <circle cx="398" cy="202" r="5.5" opacity="0.7" />
    <circle cx="398" cy="298" r="5.5" opacity="0.7" />
    <circle cx="382" cy="180" r="6" opacity="0.75" />
    <circle cx="382" cy="320" r="6" opacity="0.75" />

    <!-- Column 2 (middle) -->
    <circle cx="382" cy="250" r="8" opacity="0.9" />
    <circle cx="375" cy="222" r="8.5" opacity="0.85" />
    <circle cx="375" cy="278" r="8.5" opacity="0.85" />
    <circle cx="362" cy="198" r="7.5" opacity="0.8" />
    <circle cx="362" cy="302" r="7.5" opacity="0.8" />

    <!-- Column 3 (inner) -->
    <circle cx="348" cy="250" r="10" />
    <circle cx="342" cy="220" r="9" />
    <circle cx="342" cy="280" r="9" />
    <circle cx="330" cy="192" r="7" opacity="0.75" />
    <circle cx="330" cy="308" r="7" opacity="0.75" />
  </g>

  <!-- Central Emblem: Stylized Geometric Hourglass / Double Arch Wings -->
  <!-- Top Arc Left -->
  <path d="M 242 95 
           C 180 100 135 145 135 205
           L 182 205 
           C 182 170 205 138 242 135 Z" 
        fill="url(#emblemGrad)" stroke="#7dd3fc" stroke-width="1.5" />

  <!-- Top Arc Right -->
  <path d="M 258 95 
           C 320 100 365 145 365 205
           L 318 205 
           C 318 170 295 138 258 135 Z" 
        fill="url(#emblemGrad)" stroke="#7dd3fc" stroke-width="1.5" />

  <!-- Upper Diagonal Connecting Bevels -->
  <path d="M 135 205 L 225 240 L 210 255 L 135 205 Z" fill="#0369a1" />
  <path d="M 365 205 L 275 240 L 290 255 L 365 205 Z" fill="#0369a1" />

  <!-- Central Left Wing Body -->
  <path d="M 135 205 L 225 240 L 195 295 L 135 205 Z" fill="url(#emblemGrad)" opacity="0.3" />
  <path d="M 365 205 L 275 240 L 305 295 L 365 205 Z" fill="url(#emblemGrad)" opacity="0.3" />

  <!-- Bottom Arc Left -->
  <path d="M 242 405 
           C 180 400 135 355 135 295
           L 182 295 
           C 182 330 205 362 242 365 Z" 
        fill="url(#emblemGrad)" stroke="#7dd3fc" stroke-width="1.5" />

  <!-- Bottom Arc Right -->
  <path d="M 258 405 
           C 320 400 365 355 365 295
           L 318 295 
           C 318 330 295 362 258 365 Z" 
        fill="url(#emblemGrad)" stroke="#7dd3fc" stroke-width="1.5" />

  <!-- Angular Wing Inners (Geometric Hourglass Silhouette) -->
  <!-- Left Wing Angle -->
  <path d="M 152 195 L 225 242 L 152 290 L 175 320 L 235 260 L 235 225 L 175 165 Z" 
        fill="url(#emblemGrad)" stroke="#7dd3fc" stroke-width="1.5" filter="url(#softGlow)" />

  <!-- Right Wing Angle -->
  <path d="M 348 195 L 275 242 L 348 290 L 325 320 L 265 260 L 265 225 L 325 165 Z" 
        fill="url(#emblemGrad)" stroke="#7dd3fc" stroke-width="1.5" filter="url(#softGlow)" />

  <!-- Center Lower Stylus / Quill / Vertical Column (Knowledge & Wisdom) -->
  <path d="M 245 295 L 255 295 L 255 405 L 245 405 Z" 
        fill="url(#emblemGrad)" stroke="#7dd3fc" stroke-width="1" />
  <path d="M 250 285 L 255 295 L 245 295 Z" fill="#bae6fd" />
  <path d="M 248 300 L 252 300 L 252 385 L 248 385 Z" fill="#ffffff" opacity="0.6" />

  <!-- Central Star of Wisdom (4-Point Diamond Sparkle) -->
  <path d="M 250 215 
           C 250 238 253 245 272 250 
           C 253 255 250 262 250 285 
           C 250 262 247 255 228 250 
           C 247 245 250 238 250 215 Z" 
        fill="#e0f2fe" 
        stroke="#38bdf8" 
        stroke-width="1.5" 
        filter="url(#cyanGlow)" />

  <!-- Diamond Center Highlight -->
  <circle cx="250" cy="250" r="3.5" fill="#ffffff" />
  
  <!-- Subtle Top Rim Specular Glint -->
  <path d="M 200 24 C 230 20 270 20 300 24" stroke="#e0f2fe" stroke-width="3" stroke-linecap="round" opacity="0.75" />
</svg>
