<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <defs>
    <radialGradient id="authorBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="authorBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <circle cx="150" cy="150" r="140" fill="url(#authorBg)" stroke="url(#authorBorder)" stroke-width="4" filter="url(#softShadow)" />
  <circle cx="150" cy="150" r="132" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,6" opacity="0.5" />

  <!-- Academic Silhouette with Glasses & Formal Collar -->
  <!-- Shoulders & Coat -->
  <path d="M 60 260 C 65 200 95 190 150 190 C 205 190 235 200 240 260 Z" fill="#09101f" stroke="#0284c7" stroke-width="1.5" />
  <!-- Shirt & Tie/Scarf -->
  <path d="M 130 190 L 150 220 L 170 190 Z" fill="#f8fafc" />
  <path d="M 146 220 L 154 220 L 158 260 L 142 260 Z" fill="#0284c7" />
  
  <!-- Neck -->
  <rect x="135" y="160" width="30" height="35" rx="5" fill="#e2e8f0" />
  <!-- Head Oval -->
  <ellipse cx="150" cy="125" rx="45" ry="55" fill="#f1f5f9" />
  <!-- Hair (Clean Academic Cut) -->
  <path d="M 102 120 C 100 80 125 65 150 65 C 175 65 200 80 198 120 C 190 90 170 78 150 80 C 130 78 110 90 102 120 Z" fill="#1e293b" />
  
  <!-- Academic Glasses (Wireframe Frame) -->
  <g stroke="#0284c7" stroke-width="2.5" fill="none">
    <rect x="118" y="112" width="26" height="18" rx="4" fill="#38bdf8" fill-opacity="0.1" />
    <rect x="156" y="112" width="26" height="18" rx="4" fill="#38bdf8" fill-opacity="0.1" />
    <line x1="144" y1="120" x2="156" y2="120" stroke-width="2" />
    <line x1="108" y1="118" x2="118" y2="118" stroke-width="2" />
    <line x1="182" y1="118" x2="192" y2="118" stroke-width="2" />
  </g>
  
  <!-- Small Star of Wisdom on Lapel -->
  <polygon points="105,215 107,221 113,221 108,225 110,231 105,227 100,231 102,225 97,221 103,221" fill="#f59e0b" />
</svg>
