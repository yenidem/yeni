<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="tdeBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090514" />
    </radialGradient>
    <linearGradient id="tdeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="90" fill="url(#tdeBg)" stroke="url(#tdeGold)" stroke-width="3" />
  <circle cx="100" cy="100" r="82" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="3,4" opacity="0.6" />
  
  <!-- Stylized Ottoman / Divan Manuscript Book & Traditional Reed Pen (Kamış Kalem) -->
  <!-- Open Manuscript Pages -->
  <path d="M 45 130 C 65 120 85 125 100 135 C 115 125 135 120 155 130 L 155 75 C 135 65 115 70 100 80 C 85 70 65 65 45 75 Z" fill="#2e1065" stroke="url(#tdeGold)" stroke-width="2" />
