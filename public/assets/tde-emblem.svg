  <!-- Classical Reed Pen (Kamış Kalem / Divit) Crossing Elegantly -->
  <path d="M 140 45 L 148 53 L 88 125 L 75 130 L 80 117 Z" fill="url(#tdeGold)" />
  <circle cx="75" cy="130" r="1.5" fill="#ffffff" />
