<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="felBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#082f49" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="felCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="90" fill="url(#felBg)" stroke="url(#felCyan)" stroke-width="3" />
  <circle cx="100" cy="100" r="82" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,4" opacity="0.6" />
  
  <!-- Stylized Greek/Athena Owl of Minerva & Dialectic Light Pillar -->
  <!-- Radiating Rays of Reason -->
  <g stroke="#38bdf8" stroke-width="1" opacity="0.4">
    <line x1="100" y1="40" x2="100" y2="25" />
    <line x1="130" y1="50" x2="142" y2="38" />
    <line x1="70" y1="50" x2="58" y2="38" />
  </g>
  <!-- Torch / Column of Epistemology -->
  <path d="M 85 145 L 115 145 L 110 85 L 90 85 Z" fill="#0c4a6e" stroke="url(#felCyan)" stroke-width="1.5" />
  <line x1="95" y1="90" x2="95" y2="140" stroke="#38bdf8" stroke-width="1" opacity="0.5" />
  <line x1="105" y1="90" x2="105" y2="140" stroke="#38bdf8" stroke-width="1" opacity="0.5" />
  <!-- Flame of Consciousness -->
  <path d="M 100 50 C 90 65 92 78 100 85 C 108 78 110 65 100 50 Z" fill="url(#felCyan)" />
  <circle cx="100" cy="72" r="4" fill="#ffffff" />
  <!-- Base Pedestal -->
  <rect x="75" y="145" width="50" height="12" rx="2" fill="url(#felCyan)" />
</svg>
