name: YENİDEM — GitHub Pages, Tasarım/Kod Sertifikası & Cloudflare D1 Otomatik Yayın Hattı

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  verify-and-build:
    name: 1. SHA3-512 Tasarım/Kod Kontrolü & Angular AOT Üretim Derlemesi
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak Kodu İndir (Checkout)
        uses: actions/checkout@v4

      - name: Node.js 22 Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Bağımlılıkları Kur (npm install)
        run: npm install --legacy-peer-deps

      - name: Angular ESLint (TypeScript, HTML Şablon & Erişilebilirlik) Kod Denetimi
        run: npx ng lint

      - name: 12-Kademeli Yayın Öncesi Kod, Eklenti, 16 Kurucu Eser, Hukuk & SHA3-512 Bütünlük Taraması
        run: |
          node -e '
            const crypto = require("node:crypto");
            const fs = require("node:fs");
            const files = [
              "src/styles.css",
              "src/app/app.html",
              "src/app/core/constants/initial-articles.ts",
              "src/server/community-governance.ts",
              "wrangler.toml",
              "cloudflare-d1-schema.sql",
              "public/legal/international-cookie-privacy-policy.json",
              "public/legal/01-uluslararasi-cerez-ve-yerel-depolama-politikasi.md",
              "public/legal/02-kvkk-6698-ve-ab-gdpr-aydinlatma-beyannamesi.md",
              "public/legal/03-ccpa-gpc-cloudflare-d1-ve-worm-blokzincir-veri-protokolu.md",
              "public/legal/04-yapim-asamasi-taslak-surum-ve-telif-muafiyet-sartnamesi.md",
              "public/logo.svg",
              "src/assets/default-article-cover.svg",
              "CODEOWNERS"
            ];
            for (const f of files) {
              if (!fs.existsSync(f)) {
                console.error("KRİTİK HATA: Korunan çekirdek/eklenti dosyası eksik:", f);
                process.exit(1);
              }
              const content = fs.readFileSync(f);
              const sha3 = crypto.createHash("sha3-512").update(content).digest("hex");
              console.log("[DOĞRULANDI]", f, "-> SHA3-512:", sha3.substring(0, 28) + "...");
            }
          '

      - name: GitHub Pages Üretim Derlemesi, Alt Dizin Varlık Uyumu ve index.html / 404.html / .nojekyll Hazırlığı
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          OWNER_NAME="${GITHUB_REPOSITORY%/*}"
          if [ "${REPO_NAME}" = "${OWNER_NAME}.github.io" ]; then
            export GH_BASE_HREF="/"
            npx ng build --base-href "/"
          else
            export GH_BASE_HREF="/${REPO_NAME}/"
            npx ng build --base-href "/${REPO_NAME}/"
          fi

          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const dir = path.join(process.cwd(), "dist", "app", "browser");
            const csr = path.join(dir, "index.csr.html");
            const idx = path.join(dir, "index.html");
            const nf = path.join(dir, "404.html");
            if (fs.existsSync(csr) && !fs.existsSync(idx)) {
              fs.copyFileSync(csr, idx);
            }
            const base = process.env.GH_BASE_HREF || "/";
            if (base !== "/") {
              const prefix = base.replace(/\/$/, "");
              const walk = (d) => {
                for (const entry of fs.readdirSync(d)) {
                  const full = path.join(d, entry);
                  if (fs.statSync(full).isDirectory()) walk(full);
                  else if (/\.(html|js|css|json)$/i.test(entry)) {
                    const orig = fs.readFileSync(full, "utf8");
                    const next = orig
                      .replace(/(["\x27(])\/assets\//g, "$1" + prefix + "/assets/")
                      .replace(/(["\x27(])\/logo\.svg/g, "$1" + prefix + "/logo.svg")
                      .replace(/(["\x27(])\/legal\//g, "$1" + prefix + "/legal/");
                    if (next !== orig) fs.writeFileSync(full, next, "utf8");
                  }
                }
              };
              walk(dir);
            }
            if (fs.existsSync(idx)) {
              fs.copyFileSync(idx, nf);
            }
            fs.writeFileSync(path.join(dir, ".nojekyll"), "", "utf8");
            fs.writeFileSync(path.join(dir, "_redirects"), "/* /index.html 200\n", "utf8");
          '

      - name: gh-pages Dalına (Branch) Derlenmiş index.html ve 404.html Paketini Otomatik Yayınla
        if: github.event_name != 'pull_request'
        run: |
          cd dist/app/browser
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add -A
          git commit -m "Deploy YENİDEM compiled Angular bundle (index.html + .nojekyll)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: GitHub Pages Artifact Yükle
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/app/browser

  deploy-github-pages:
    name: 2. GitHub Pages Canlı Site Yayını
    if: github.event_name != 'pull_request'
    needs: verify-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages Ortamına Yayınla
        id: deployment
        uses: actions/deploy-pages@v4
