name: YENİDEM — Deterministik Derleme, Sertifika ve GitHub Pages Yayını

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.15.0"
  BUILD_CONFIGURATION: "production"
  DIST_DIR: "dist/app/browser"
  CUSTOM_DOMAIN: "orcunkundakci.tr"

jobs:
  # ============================================================
  # BUILD / VERIFY
  # ============================================================
  verify-and-build:
    name: Build, Verify and Package
    runs-on: ubuntu-22.04

    steps:
      # --------------------------------------------------------
      # Source
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # --------------------------------------------------------
      # Node.js
      # --------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # --------------------------------------------------------
      # PNPM
      # --------------------------------------------------------
      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      # --------------------------------------------------------
      # Environment verification
      # --------------------------------------------------------
      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail

          echo "Node:"
          node --version

          echo "PNPM:"
          pnpm --version

          echo "Angular:"
          pnpm exec ng version

      # --------------------------------------------------------
      # Dependencies
      # --------------------------------------------------------
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --------------------------------------------------------
      # GitHub Pages configuration
      # --------------------------------------------------------
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # --------------------------------------------------------
      # Protected source files
      # --------------------------------------------------------
      - name: Verify protected core files
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require("node:fs");
          const crypto = require("node:crypto");

          const protectedFiles = [
            "src/styles.css",
            "src/app/core/constants/initial-articles.ts",
            "src/server/community-governance.ts",
            "src/app/app.html"
          ];

          let failed = false;

          for (const file of protectedFiles) {
            if (!fs.existsSync(file)) {
              console.error(
                `[CRITICAL] Protected file missing: ${file}`
              );

              failed = true;
              continue;
            }

            const content = fs.readFileSync(file);

            const sha3 = crypto
              .createHash("sha3-512")
              .update(content)
              .digest("hex");

            console.log(
              `[VERIFIED] ${file}`
            );

            console.log(
              `SHA3-512: ${sha3}`
            );
          }

          if (failed) {
            process.exit(1);
          }
          NODE

      # --------------------------------------------------------
      # Lint
      # --------------------------------------------------------
      - name: Run lint
        run: pnpm exec ng lint

      # --------------------------------------------------------
      # Production build
      # --------------------------------------------------------
      - name: Build Angular application
        run: pnpm run build -- --configuration=${{ env.BUILD_CONFIGURATION }}

      # --------------------------------------------------------
      # Verify Angular output
      # --------------------------------------------------------
      - name: Verify production build
        shell: bash
        run: |
          set -euo pipefail

          echo "Expected build directory:"
          echo "${DIST_DIR}"
          echo

          if [ ! -d "${DIST_DIR}" ]; then
            echo "[CRITICAL] Build directory not found:"
            echo "${DIST_DIR}"
            echo
            echo "Available dist structure:"
            find dist -maxdepth 5 -print 2>/dev/null || true
            exit 1
          fi

          if [ ! -f "${DIST_DIR}/index.html" ]; then
            echo "[CRITICAL] index.html not found:"
            echo "${DIST_DIR}/index.html"
            echo
            echo "Available files:"
            find "${DIST_DIR}" -maxdepth 3 -type f -print | sort
            exit 1
          fi

          echo "[OK] Angular production build verified."
          echo
          echo "Build files:"
          find "${DIST_DIR}" -maxdepth 3 -type f -print | sort

      # --------------------------------------------------------
      # Validate index.html
      # --------------------------------------------------------
      - name: Validate index.html
        shell: bash
        run: |
          set -euo pipefail

          INDEX="${DIST_DIR}/index.html"

          grep -q "<app-root" "${INDEX}" || {
            echo "[CRITICAL] Angular app-root element not found."
            exit 1
          }

          grep -q "<base href=\"/\"" "${INDEX}" || {
            echo "[CRITICAL] Expected <base href=\"/\"> not found."
            exit 1
          }

          echo "[OK] index.html validation passed."

      # --------------------------------------------------------
      # Custom domain
      # --------------------------------------------------------
      - name: Create CNAME
        shell: bash
        run: |
          set -euo pipefail

          printf '%s\n' "${CUSTOM_DOMAIN}" > "${DIST_DIR}/CNAME"

          echo "CNAME:"
          cat "${DIST_DIR}/CNAME"

          test "$(cat "${DIST_DIR}/CNAME")" = "${CUSTOM_DOMAIN}"

      # --------------------------------------------------------
      # SPA fallback
      # --------------------------------------------------------
      - name: Create SPA fallback
        shell: bash
        run: |
          set -euo pipefail

          cp "${DIST_DIR}/index.html" "${DIST_DIR}/404.html"

          test -f "${DIST_DIR}/404.html"

          echo "[OK] 404.html created."

      # --------------------------------------------------------
      # No Jekyll processing
      # --------------------------------------------------------
      - name: Disable Jekyll processing
        shell: bash
        run: |
          set -euo pipefail

          touch "${DIST_DIR}/.nojekyll"

          test -f "${DIST_DIR}/.nojekyll"

          echo "[OK] .nojekyll created."

      # --------------------------------------------------------
      # Integrity certificate
      # --------------------------------------------------------
      - name: Generate build integrity certificate
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require("node:fs");
          const crypto = require("node:crypto");

          const files = [
            "src/styles.css",
            "src/app/core/constants/initial-articles.ts",
            "src/server/community-governance.ts",
            "src/app/app.html"
          ];

          const hashes = [];

          for (const file of files) {
            if (!fs.existsSync(file)) {
              throw new Error(`Protected file missing: ${file}`);
            }

            const content = fs.readFileSync(file);

            const hash = crypto
              .createHash("sha3-512")
              .update(content)
              .digest("hex");

            hashes.push({
              file,
              sha3_512: hash
            });
          }

          const canonical = hashes
            .map((entry) => `${entry.file}:${entry.sha3_512}`)
            .join("\n");

          const merkleRoot = crypto
            .createHash("sha3-512")
            .update(canonical)
            .digest("hex");

          const certificate = {
            schema: "YENİDEM-CODE-DESIGN-CERT-PQC-1",
            algorithm: "SHA3-512",
            generatedAt: new Date().toISOString(),
            files: hashes,
            merkleRootSha3_512: merkleRoot
          };

          fs.writeFileSync(
            "CODE-DESIGN-CERT-PQC.json",
            JSON.stringify(certificate, null, 2) + "\n"
          );

          fs.writeFileSync(
            "CODE-DESIGN-CERT-PQC.txt",
            [
              "YENİDEM CODE-DESIGN-CERT-PQC",
              "",
              `Generated: ${certificate.generatedAt}`,
              "",
              ...hashes.map(
                (entry) =>
                  `${entry.file}:${entry.sha3_512}`
              ),
              "",
              `MERKLE_ROOT_SHA3_512=${merkleRoot}`,
              ""
            ].join("\n")
          );

          console.log("");
          console.log("==================================================");
          console.log("CODE-DESIGN-CERT-PQC");
          console.log("==================================================");
          console.log(`Algorithm: SHA3-512`);
          console.log(`Merkle Root: ${merkleRoot}`);
          console.log("==================================================");
          NODE

      # --------------------------------------------------------
      # Verify final Pages artifact
      # --------------------------------------------------------
      - name: Verify Pages artifact
        shell: bash
        run: |
          set -euo pipefail

          REQUIRED_FILES=(
            "${DIST_DIR}/index.html"
            "${DIST_DIR}/404.html"
            "${DIST_DIR}/CNAME"
            "${DIST_DIR}/.nojekyll"
          )

          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "${file}" ]; then
              echo "[CRITICAL] Required artifact file missing:"
              echo "${file}"
              exit 1
            fi

            echo "[OK] ${file}"
          done

          echo
          echo "Final artifact:"
          du -sh "${DIST_DIR}"
          echo
          find "${DIST_DIR}" -maxdepth 2 -type f -print | sort

      # --------------------------------------------------------
      # Upload Pages artifact
      # --------------------------------------------------------
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ env.DIST_DIR }}

  # ============================================================
  # DEPLOY
  # ============================================================
  deploy:
    name: Deploy to GitHub Pages
    needs: verify-and-build

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-22.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
